[unit]
id = "core.sched"
kind = "logic"
process = ["sched"]
entry = "core.sched.unit:Unit"

[provides]
services = ["proc.loop@1", "sched.status@1"]

[requires]
optional = ["kv.cache@1"]
services = ["sched.reqs@1", "ledger.domains@1", "policy.order@1", "policy.compose@1", "proc.streams@1", "proc.control@1"]

[capabilities]
accept_config = true
actions = ["drain"]  # a change applies to an empty engine (doc/specs/empty-apply.md)

[reads]
# What one row of the workers' persistent batch holds (worker.batch; stage2-contract.md §4.3).
config = ["batch.max_rows", "batch.max_context_len", "holder.sleep", "spec.algorithm", "spec.num_draft_tokens"]

[config]
"sched.workers" = { type = "list", default = [], binding = "startup", doc = "The workers' ProcIds, rank 0 first; one per rank." }
"sched.frontend_host" = { type = "str", default = "", binding = "startup", doc = "Host of the frontend that writes to the reader requests." }
"sched.max_batch" = { type = "int", default = 32, binding = "startup", doc = "Rows plans use at most; never more than the workers' batch.max_rows." }
"sched.domains" = { type = "int", default = 1, binding = "startup", doc = "Scheduling domains (data parallel): sched.workers is split into this many groups of ranks, in order. Each has sched.max_batch rows, a ledger and requests of its own; the ranks of one group run the same plan. All groups step together. 1: every rank runs the same plan." }
"sched.token_budget" = { type = "int", default = 2048, binding = "startup", doc = "Prompt tokens per step (sglang's chunked_prefill_size, smallest default)." }
"sched.overlap" = { type = "bool", default = false, binding = "live", doc = "Plan step N + 1 before step N's result (stage2-contract.md 4.4)." }
"sched.step_timeout_s" = { type = "float", default = 3600.0, binding = "startup", doc = "A step without every rank's answer for this long counts as a worker failure. Long: a first GPU step may compile for minutes." }
"sched.quiesce_timeout_s" = { type = "float", default = 30.0, binding = "startup", doc = "How long a pause waits for the steps in flight; then the pause fails and the engine goes on serving." }
"sched.frontend_timeout_s" = { type = "float", default = 5.0, binding = "startup", doc = "A frontend that takes no tokens for this long has its requests cancelled." }
"sched.idle_wait_s" = { type = "float", default = 0.01, binding = "startup", doc = "Longest wait for a record when there is nothing to do." }
"sched.overlap_lead_s" = { type = "float", default = 0.0, binding = "live", doc = "With sched.overlap, hold planning step N + 1 during an in-flight prefill step until step N is within this many seconds of its estimated completion (or every domain is saturated), so arriving requests batch across domains; 0: plan at once." }
"sched.prefill_coalesce_s" = { type = "float", default = 0.0, binding = "live", doc = "When idle with multiple domains and no decoding requests, wait up to this many seconds for arriving prefill requests to fill idle domains before sealing step 1; 0: plan at once." }
"sched.prefill_interval" = { type = "int", default = 0, binding = "live", doc = "Decode steps between prefill admissions across domains while any domain decodes (0: admit at once); unlocked early when a domain accumulates a near-full prefill batch." }
"sched.balance_prefill" = { type = "bool", default = false, binding = "live", doc = "Route waiting requests to the domain with fewest queued prompt tokens before breaking ties by free rows." }
"sched.prefill_occupancy_target" = { type = "int", default = 0, binding = "live", doc = "Scale the prefill interval by active decoding rows until this many rows per domain are decoding. 0 keeps the fixed interval." }

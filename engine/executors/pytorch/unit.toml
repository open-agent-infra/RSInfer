[unit]
id = "executors.pytorch"
kind = "logic"
process = ["worker"]
entry = "executors.pytorch.unit:Unit"

[provides]
services = ["executor@1"]

[requires]
optional = ["kv.cache@1"]
services = ["worker.batch@1", "plan@1", "layers.sampler@1", "model@1"]

[config]
# Speculative decoding with the model's MTP layer (doc/specs/mtp.md), SGLang's EAGLE chain.
"spec.algorithm" = { type = "str", default = "", binding = "startup", doc = "SGLang's --speculative-algorithm: \"\" (off, the default) or \"eagle\" (the model's MTP layer drafts; SGLang runs NEXTN as EAGLE)." }
"spec.num_steps" = { type = "int", default = 3, binding = "startup", doc = "SGLang's --speculative-num-steps: draft tokens per step, the first from the draft extend." }
"spec.eagle_topk" = { type = "int", default = 1, binding = "startup", doc = "SGLang's --speculative-eagle-topk; only 1 (a chain) is supported." }
"spec.num_draft_tokens" = { type = "int", default = 4, binding = "startup", doc = "SGLang's --speculative-num-draft-tokens: tokens a decode row verifies, num_steps + 1 for a chain." }

[unit]
id = "models.ds1017"
kind = "logic"
process = ["worker"]
entry = "models.ds1017.unit:Unit"

[provides]
services = ["model@1"]

[requires]
services = ["state.weights@1", "state.holder@1", "state.kv.paged@1", "state.swa.slots@1", "layers.embedding@1",
            "layers.ds1017@1", "comm.group@1", "expert.placement@1"]

[reads]
config = ["model.path", "model.hf_config", "model.dtype", "state.kv.page_size", "weights.path", "dsv4.backend", "deepinfer.nvlink_engram", "batch.max_rows", "sampler.force_topk"]

[config]
"dsv4.graph_idle_experts" = { type = "bool", default = false, binding = "startup", doc = "Replay graph-captured EP expert participation on ranks with no local rows." }
"dsv4.vp_head" = { type = "bool", default = true, binding = "startup", doc = "Use NVLink5 vocab-parallel greedy LM head + fused Split-K argmax across ranks." }

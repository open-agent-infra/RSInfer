name: ci
on:
  # Pull requests run once per push; pushes run only where pull requests land.
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    # GitHub-hosted Linux runner.
    runs-on: ubuntu-latest
    env:
      # One torch thread per process. A runner's machine has many cores, and torch starts a thread
      # on each of them in every engine process of every test: two runs at once took 2.5 times as
      # long and ran into a test's 120 s limit. The tests' models are tiny: with one thread the suite
      # takes as long, on a fraction of the CPU time.
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base of a pull request, to see what it changed
      - uses: astral-sh/setup-uv@v6
        with:
          # These runners persist: uv's cache stays on their disk, nothing goes to GitHub's cache.
          enable-cache: false
          cache-local-path: ~/.cache/uv
      - run: uv sync --python 3.12 --extra cpu
      - run: uv run pyright
      - id: scope
        name: does the change touch the framework?
        # If this fails, it shows as failed and every test runs: an unknown scope never skips tests.
        continue-on-error: true
        run: |
          framework=$(PYTHONPATH=engine uv run python .github/scripts/framework_changed.py "${{ github.event.pull_request.base.sha || github.event.before }}")
          case "$framework" in
            true|false) echo "framework=$framework" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected answer: '$framework'"; exit 1 ;;
          esac
      # Each test may start several engine processes; leave room for them on the hosted runner.
      - name: pytest
        if: steps.scope.outputs.framework != 'false'
        run: uv run pytest -n 2
      - name: pytest without tests/framework (the framework did not change)
        if: steps.scope.outputs.framework == 'false'
        run: uv run pytest -n 2 --ignore=tests/framework

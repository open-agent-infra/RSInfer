[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aka-ds1017-kernels"
version = "0.1.0"
requires-python = ">=3.12"
description = "Source-built DS1017 prefill kernels for the DeepInfer backend on NVIDIA B200"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
aka_ds1017 = ["kernels.tar.gz", "provenance.json"]
